name: Deploy Dev Build

on:
  push:
    branches: ["development"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-dev"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install
        run: npm install
      - name: Build game
        run: npm run dendrynexus make-html -- --pretty
      - name: Copy game.json to output
        run: cp out/game.json out/html/
      - name: Deploy to gh-pages /dev subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out/html
          target-folder: dev
          branch: gh-pages
          clean: false
